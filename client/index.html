<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yakuhelper Demo</title>
  </head>

  <body class="min-h-screen bg-gray-100 text-gray-900">
    <main class="mx-auto max-w-3xl px-6 py-16">
      <h1 class="text-3xl font-bold tracking-tight">
          役helper
      </h1>

      <p class="mt-2 text-gray-600">
          麻雀 helper!
      </p>

      <section class="mt-10 rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
          <h2 class="text-lg font-semibold">
              役牌を読み込む
          </h2>

          <p class="mt-2 text-sm text-gray-500">
              役牌一覧を表示
          </p>

        <button
          hx-get="/fragments/tile.html"
          hx-target="#content"
          hx-swap="innerHTML"
          class="mt-5 rounded-lg bg-blue-600 px-4 py-2 font-medium text-white transition hover:bg-blue-700"
        >
          手牌を読み込む
        </button>

        <div
          id="content"
          class="mt-6 rounded-lg border border-dashed border-gray-300 p-5"
        >
            <p class="text-sm text-gray-400">
                手牌が空です
            </p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
